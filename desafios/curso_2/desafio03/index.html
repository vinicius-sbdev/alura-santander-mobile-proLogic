<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 01</title>
</head>
<body>
    <h1>Desafio 03</h1>
    <hr>
    <h2>Exercício 0.1 - Calculo IMC</h2>
        <<!-- Campos de entrada -->
    <label for="altura">Altura (em metros):</label>
    <input type="number" id="altura" step="0.01" placeholder="Ex: 1.69"> <br>

    <label for="peso">Peso (em kg):</label>
    <input type="number" id="peso" placeholder="Ex: 86"> <br>

    <!-- Botão -->
    <button onclick="exibirNaTela()">Calcular IMC</button>

    <!-- Resultado -->
    <p id="resultado_p"></p> <hr>

    <h2>Exercício 0.2 - Calculo Fatorial</h2>
        <<!-- Campos de entrada -->
    <label for="numeroFatorial">Digite um número inteiro</label>
    <input type="number" id="fatorial" step="1" placeholder="Ex: 5"> <br>

    <!-- Botão -->
    <button onclick="valorFatorial()">Calcular IMC</button>

    <!-- Resultado -->
    <p id="resultado_fatorial"></p>



    <script src="app.js"></script>
</body>
</html>
